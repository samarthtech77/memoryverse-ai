<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780" role="img" aria-labelledby="title description">
  <title id="title">MemoryVerse AI workflow</title>
  <desc id="description">Documents are ingested, analysed locally, stored as structured memories, linked into a knowledge graph, shown on a timeline, and retrieved through natural language search with original evidence.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#091326"/><stop offset="1" stop-color="#132a4b"/></linearGradient>
    <linearGradient id="accent" x1="0" x2="1"><stop stop-color="#9c8cff"/><stop offset="1" stop-color="#5de7d0"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020714" flood-opacity=".5"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#91a6cd"/></marker>
    <style>text{font-family:Arial,sans-serif}.title{font-size:34px;font-weight:700;fill:#eff4ff}.subtitle{font-size:16px;fill:#aebcda}.label{font-size:17px;font-weight:700;fill:#eef3ff}.detail{font-size:13px;fill:#b9c8e4}.tiny{font-size:12px;fill:#77e8d8;font-weight:700;letter-spacing:1px}</style>
  </defs>
  <rect width="1400" height="780" fill="url(#background)" rx="28"/>
  <circle cx="1250" cy="100" r="210" fill="#7659d4" opacity=".12"/><circle cx="130" cy="700" r="190" fill="#26baa8" opacity=".1"/>
  <text class="title" x="70" y="82">MemoryVerse AI — Digital Identity Workflow</text><text class="subtitle" x="70" y="112">From fragmented evidence to a searchable, connected student journey.</text>
  <g filter="url(#shadow)"><rect x="75" y="220" width="210" height="150" rx="18" fill="#172d51" stroke="#48648e"/><text class="tiny" x="100" y="254">INPUT</text><text class="label" x="100" y="290">Student evidence</text><text class="detail" x="100" y="320">PDF · DOCX · Images</text><text class="detail" x="100" y="344">Resumes · certificates</text></g>
  <g filter="url(#shadow)"><rect x="370" y="185" width="250" height="220" rx="18" fill="#222550" stroke="#8676dd"/><text class="tiny" x="397" y="221">PYTHON INGESTION</text><text class="label" x="397" y="257">Local analysis</text><text class="detail" x="397" y="288">• Extract text / metadata</text><text class="detail" x="397" y="314">• Detect category and skills</text><text class="detail" x="397" y="340">• Preserve original file</text><text class="detail" x="397" y="366">• Store structured record</text></g>
  <g filter="url(#shadow)"><rect x="710" y="185" width="270" height="220" rx="18" fill="#133f51" stroke="#4fcdbd"/><text class="tiny" x="738" y="221">KNOWLEDGE LAYER</text><text class="label" x="738" y="257">Connected memory</text><text class="detail" x="738" y="288">Skills ↔ projects</text><text class="detail" x="738" y="314">Certificates ↔ proof</text><text class="detail" x="738" y="340">Internships ↔ career path</text><text class="detail" x="738" y="366">Confidence + evidence</text></g>
  <g filter="url(#shadow)"><rect x="1065" y="220" width="255" height="150" rx="18" fill="#25354c" stroke="#7298c3"/><text class="tiny" x="1092" y="254">EXPERIENCE</text><text class="label" x="1092" y="290">Student dashboard</text><text class="detail" x="1092" y="320">Search · timeline · links</text><text class="detail" x="1092" y="344">Open original evidence</text></g>
  <path d="M285 295 H370" stroke="#91a6cd" stroke-width="3" marker-end="url(#arrow)"/><path d="M620 295 H710" stroke="#91a6cd" stroke-width="3" marker-end="url(#arrow)"/><path d="M980 295 H1065" stroke="#91a6cd" stroke-width="3" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)"><rect x="300" y="520" width="800" height="125" rx="18" fill="#121f3b" stroke="url(#accent)"/><text class="tiny" x="330" y="554">NATURAL-LANGUAGE RETRIEVAL</text><text class="label" x="330" y="590">“Show my AI projects”  →  weighted matching  →  ranked source-backed results</text><text class="detail" x="330" y="618">Prototype: transparent browser + Python scoring. Production: NLP, embeddings, vector database, semantic search, and RAG.</text></g>
  <path d="M845 405 V520" stroke="#91a6cd" stroke-width="3" marker-end="url(#arrow)"/><path d="M1100 520 C1220 500,1230 420,1190 370" fill="none" stroke="#91a6cd" stroke-width="3" marker-end="url(#arrow)"/>
  <text class="subtitle" x="70" y="728">MemoryVerse does not only store files—it understands the relationships that represent a student’s growth.</text>
</svg>
